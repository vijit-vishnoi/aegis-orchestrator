version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: aegis
    ports:
      - "5432:5432"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"

  target_app:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./target_app:/app
    ports:
      - "8000:8000"
    command: bash -c "pip install fastapi uvicorn prometheus_client && uvicorn main:app --host 0.0.0.0 --port 8000"
